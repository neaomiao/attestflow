schema_version: 1
project:
  name: attestflow
  adapter: attestflow
  default_branch: main
  language: en
paths:
  tasks: harness/tasks
  runs: harness/runs
  gates: harness/gates
  locks: harness/locks
  capability_runs: harness/capability-runs
  autopilot_runs: harness/autopilot-runs
  ci_runs: harness/ci-runs
  git_runs: harness/git-runs
  pr_runs: harness/pr-runs
  release_runs: harness/release-runs
  plugin_runs: harness/plugin-runs
  sources: harness/sources
  specs: harness/specs
  requirement_runs: harness/requirement-runs
  docs: docs
commands:
  bdd: python -m unittest tests.bdd.test_attestflow_dogfood_behavior
  unit: python -m unittest tests.unit.test_attestflow_dogfood
  lint: null
  typecheck: null
  secret_scan: python -m attestflow secret-scan
  project_verify: null
policies:
  require_bdd_before_unit: true
  require_unit_before_implementation: true
  require_fresh_verify_for_done: true
  require_agent_session_for_task: true
  require_disjoint_agent_write_scopes: true
  require_issue_triage_for_linked_issues: true
  docker_required: false
security:
  provider_commands:
    allowlist:
      - python3
    max_output_bytes: 1048576
    require_approval_for_irreversible: true
    sandbox:
      mode: inherit-env
      allowed_env: []
      blocked_env: []
      blocked_env_prefixes: []
      network: provider-owned
  network:
    mode: provider-owned
  filesystem:
    mode: write-scope-validated
requirements:
  clarifier_command: null
  max_open_questions: 5
sessions:
  agent_provider: command
  role: worker_agent
  launch_command: null
  resume_command: null
  provider_options: {}
  worktree:
    enabled: false
    path_template: ../.attestflow-worktrees/{project}/{task_id}-{run_id}
autopilot:
  max_repair_attempts: 1
  default_limit: 1
  max_steps: 1
  max_loop_cycles: 20
  loop_interval_seconds: 0
capabilities:
  intake:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  planner:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  bdd:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  tdd:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  implementer:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  reviewer:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  verifier:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
  releaser:
    agent_provider: command
    command: python3 examples/providers/local_agent.py
context:
  enabled: true
  max_tree_entries: 400
  max_file_bytes: 8000
  max_index_files: 400
  documents:
    - README.md
    - README.zh-CN.md
    - AGENTS.md
    - harness.yml
    - pyproject.toml
    - SECURITY.md
    - docs/contracts/capability-schema.md
    - docs/contracts/session-adapter-schema.md
    - docs/contracts/planner-output-schema.md
    - docs/contracts/task-schema.md
    - docs/design/universal-harness.md
token_economy:
  enabled: true
  budgets:
    default_input_tokens: 24000
    planner_input_tokens: 32000
    releaser_input_tokens: 32000
  context_cache:
    enabled: true
    path: harness/context-cache
    max_summary_bytes: 800
  provider_cache:
    enabled: false
    path: harness/provider-cache
  incremental_context:
    enabled: true
  dynamic_context:
    enabled: true
    auto_resolve: true
    max_requests: 5
  evidence_summary:
    enabled: true
    max_output_bytes: 2000
integrations:
  git_provider: optional
  ci_provider: optional
  pr_provider: optional
  release_provider: optional
plugins:
  directories:
    - harness/plugins
policy_packs:
  directories:
    - harness/policies
