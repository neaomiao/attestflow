schema_version: 1
project:
  name: python-basic
  default_branch: main
  adapter: python
commands:
  bdd: python -m unittest discover -s tests/bdd
  unit: python -m unittest discover -s tests/unit
  lint: null
  typecheck: null
  secret_scan: python -m attestflow secret-scan
  project_verify: null
autopilot:
  max_repair_attempts: 1
  default_limit: 1
  max_steps: 1
  max_loop_cycles: 12
  loop_interval_seconds: 0
sessions:
  agent_provider: command
  role: worker_agent
  launch_command: null
  resume_command: null
  provider_options:
    timeout_seconds: 30
  worktree:
    enabled: false
    path_template: ../.attestflow-worktrees/{project}/{task_id}-{run_id}
capabilities:
  planner:
    agent_provider: command
    command: python ../providers/local_agent.py
  bdd:
    agent_provider: command
    command: python ../providers/local_agent.py
  tdd:
    agent_provider: command
    command: python ../providers/local_agent.py
  implementer:
    agent_provider: command
    command: python ../providers/local_agent.py
  reviewer:
    agent_provider: command
    command: python ../providers/local_agent.py
  verifier:
    agent_provider: command
    command: null
  releaser:
    agent_provider: command
    command: null
context:
  enabled: true
  max_tree_entries: 100
  max_file_bytes: 4000
  documents:
    - README.md
    - harness.yml
integrations:
  git_provider: optional
  ci_provider: optional
  pr_provider: optional
  release_provider: optional
