name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Verify
        run: PYTHONDONTWRITEBYTECODE=1 python -m attestflow verify
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          attestflow init --path /tmp/attestflow-smoke --adapter python --agent-provider command
          cd /tmp/attestflow-smoke
          attestflow doctor
